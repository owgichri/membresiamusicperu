.stick-btn{flex:0 0 auto;min-height:46px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;font-size:15px;font-weight:700}
footer{padding-bottom:110px !important}
}
@keyframes stickUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.lb,.stick{animation:none}}
.pl-spin{width:24px;height:24px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#ffffff;animation:plSpin .8s linear infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
</style>
